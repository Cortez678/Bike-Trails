<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранные маршруты | Bike Trails</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .favorites-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .favorite-card {
            background: rgba(20,30,45,0.7);
            border-radius: 1rem;
            overflow: hidden;
            transition: transform 0.2s;
            cursor: pointer;
        }
        .favorite-card:hover {
            transform: translateY(-5px);
        }
        .favorite-image {
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .remove-fav {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: none;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            color: #ff3b30;
        }
        .remove-fav:hover {
            background: #ff3b30;
            color: white;
        }
        .favorite-info {
            padding: 1rem;
        }
        .empty-favorites {
            text-align: center;
            padding: 3rem;
            color: #8a9bb5;
        }
        .back-btn {
            background: rgba(74,144,226,0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="favorites-header">
            <h1>❤️ Избранные маршруты</h1>
            <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
        </div>
        <div id="favoritesContainer" class="favorites-grid">
            <div class="empty-favorites">Загрузка...</div>
        </div>
        <footer class="footer">
            <p>© 2025 Bike Trails — веломаршруты по России</p>
        </footer>
    </div>
    
    <script src="theme.js"></script>
    <script>
        const CURRENT_USER_KEY = 'bike_trails_current_user';
        const USERS_KEY = 'bike_trails_users';
        
        function getCurrentUser() {
            const user = localStorage.getItem(CURRENT_USER_KEY);
            return user ? JSON.parse(user) : null;
        }
        
        function getUsers() {
            const users = localStorage.getItem(USERS_KEY);
            return users ? JSON.parse(users) : [];
        }
        
        function saveUsers(users) {
            localStorage.setItem(USERS_KEY, JSON.stringify(users));
        }
        
        function removeFromFavorites(trailId) {
            const user = getCurrentUser();
            if (!user) return;
            const users = getUsers();
            const userIndex = users.findIndex(u => u.id === user.id);
            if (userIndex !== -1) {
                users[userIndex].favorites = users[userIndex].favorites.filter(id => id !== trailId);
                saveUsers(users);
                localStorage.setItem(CURRENT_USER_KEY, JSON.stringify({ ...user, favorites: users[userIndex].favorites }));
                location.reload();
            }
        }
        
        const user = getCurrentUser();
        const container = document.getElementById('favoritesContainer');
        
        if (!user) {
            container.innerHTML = '<div class="empty-favorites">🔒 Войдите в аккаунт, чтобы просматривать избранные маршруты<br><button class="back-btn" onclick="location.href=\'index.html\'" style="margin-top:1rem;">На главную</button></div>';
        } else {
            const trails = [
                { id: 1, name: "Воробьёвы горы", image: "images/vorobyovy-gory-1.jpg" },
                { id: 2, name: "Куршская коса", image: "images/kurshskaya-kosa-1.jpg" },
                { id: 3, name: "Лаго-Наки", image: "" },
                { id: 4, name: "Алтайский Марс", image: "" },
                { id: 5, name: "Байкальская петля", image: "" },
                { id: 6, name: "Долина гейзеров", image: "" }
            ];
            const favorites = user.favorites || [];
            const favoriteTrails = trails.filter(t => favorites.includes(t.id));
            
            if (favoriteTrails.length === 0) {
                container.innerHTML = '<div class="empty-favorites">⭐ У вас пока нет избранных маршрутов<br><button class="back-btn" onclick="location.href=\'index.html\'" style="margin-top:1rem;">Выбрать маршруты</button></div>';
            } else {
                container.innerHTML = favoriteTrails.map(trail => `
                    <div class="favorite-card">
                        <div class="favorite-image" style="background: ${trail.image ? `url('${trail.image}')` : 'linear-gradient(135deg,#2b2d42,#353b48)'}; background-size:cover;">
                            <button class="remove-fav" data-id="${trail.id}">✕</button>
                        </div>
                        <div class="favorite-info" onclick="location.href='trail-${trail.id}.html'">
                            <h3>${trail.name}</h3>
                        </div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.remove-fav').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeFromFavorites(parseInt(btn.dataset.id));
                    });
                });
            }
        }
    </script>
</body>
</html>
