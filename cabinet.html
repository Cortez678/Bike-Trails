<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Bike Trails</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .cabinet-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .cabinet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .back-btn {
            background: rgba(74, 144, 226, 0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            color: white;
        }
        .user-info-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        /* Геймификация */
        .gamification-block {
            background: rgba(20, 30, 45, 0.5);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .level-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .level-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            padding: 0.5rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }
        .xp-bar-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            height: 20px;
            overflow: hidden;
            margin: 0.5rem 0;
        }
        .xp-bar {
            background: linear-gradient(135deg, #4a90e2, #7b3fe4);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 1rem;
        }
        .xp-info {
            font-size: 0.8rem;
            color: #8a9bb5;
        }
        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 0.8rem;
            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }
        .achievement-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.8rem;
            padding: 0.8rem;
            text-align: center;
            transition: transform 0.2s;
        }
        .achievement-card.unlocked {
            border: 1px solid #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }
        .achievement-card.locked {
            opacity: 0.5;
        }
        .achievement-icon {
            font-size: 1.5rem;
            margin-bottom: 0.3rem;
        }
        .achievement-name {
            font-size: 0.75rem;
            font-weight: bold;
        }
        .achievement-desc {
            font-size: 0.65rem;
            color: #8a9bb5;
            margin-top: 0.2rem;
        }
        .xp-history-list {
            max-height: 200px;
            overflow-y: auto;
            margin-top: 1rem;
        }
        .xp-history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.8rem;
        }
        .xp-history-amount {
            color: #4cd964;
            font-weight: bold;
        }
        .xp-history-date {
            font-size: 0.7rem;
            color: #8a9bb5;
        }
        .logout-btn {
            background: #ff3b30;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            color: white;
            margin-top: 1rem;
        }
        /* Светлая тема */
        body.light-theme .gamification-block {
            background: rgba(255, 255, 255, 0.8);
        }
        body.light-theme .xp-bar-container {
            background: rgba(0, 0, 0, 0.1);
        }
        body.light-theme .achievement-card {
            background: rgba(0, 0, 0, 0.05);
        }
        body.light-theme .xp-history-item {
            border-bottom-color: rgba(0, 0, 0, 0.05);
        }
        @media (max-width: 768px) {
            .cabinet-container { padding: 1rem; }
            .achievements-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="cabinet-container">
        <div class="cabinet-header">
            <h1>👤 Личный кабинет</h1>
            <button class="back-btn" onclick="location.href='index.html'">← На главную</button>
        </div>
        
        <div class="user-info-card">
            <p><strong>Имя пользователя:</strong> <span id="usernameDisplay"></span></p>
            <p><strong>Дата регистрации:</strong> <span id="regDateDisplay"></span></p>
            <button id="logoutBtn" class="logout-btn">Выйти</button>
        </div>
        
        <!-- Блок геймификации -->
        <div class="gamification-block">
            <div class="level-section">
                <div class="level-badge" id="levelBadge">🚲 Новичок</div>
                <div class="xp-bar-container">
                    <div class="xp-bar" id="xpBar" style="width: 0%"></div>
                </div>
                <div class="xp-info">
                    <span id="currentXP">0</span> / <span id="nextXP">100</span> XP
                </div>
            </div>
            
            <h3>🏆 Достижения</h3>
            <div id="achievementsList" class="achievements-grid"></div>
            
            <h3>📜 История опыта</h3>
            <div id="xpHistoryList" class="xp-history-list"></div>
        </div>
    </div>

    <script src="gamification.js"></script>
    <script>
        const CURRENT_USER_KEY = 'bike_trails_current_user';
        const USERS_KEY = 'bike_trails_users';
        
        function getCurrentUser() {
            const user = localStorage.getItem(CURRENT_USER_KEY);
            return user ? JSON.parse(user) : null;
        }
        
        function getUsers() {
            const users = localStorage.getItem(USERS_KEY);
            return users ? JSON.parse(users) : [];
        }
        
        function logout() {
            localStorage.removeItem(CURRENT_USER_KEY);
            location.href = 'index.html';
        }
        
        // Отображение информации о пользователе
        const user = getCurrentUser();
        if (!user) {
            location.href = 'index.html';
        } else {
            document.getElementById('usernameDisplay').innerText = user.username;
            const users = getUsers();
            const fullUser = users.find(u => u.id === user.id);
            if (fullUser && fullUser.createdAt) {
                const date = new Date(fullUser.createdAt);
                document.getElementById('regDateDisplay').innerText = date.toLocaleDateString('ru-RU');
            } else {
                document.getElementById('regDateDisplay').innerText = 'Неизвестно';
            }
        }
        
        document.getElementById('logoutBtn')?.addEventListener('click', logout);
        
        // Отображение геймификации
        function displayGamification() {
            const user = getCurrentUser();
            if (!user) return;
            
            const userId = user.id;
            
            if (typeof getUserXP === 'undefined') {
                document.getElementById('levelBadge').innerHTML = '🚲 Загрузка...';
                return;
            }
            
            const xp = getUserXP(userId);
            const level = getUserLevel(xp);
            const xpToNext = getXPToNextLevel(xp);
            const progress = getLevelProgress(xp);
            
            document.getElementById('levelBadge').innerHTML = `${level.name} (ур. ${level.level})`;
            document.getElementById('xpBar').style.width = `${progress}%`;
            document.getElementById('currentXP').innerText = xp;
            document.getElementById('nextXP').innerText = xpToNext;
            
            const userAchievements = getUserAchievements(userId);
            const achievementsContainer = document.getElementById('achievementsList');
            achievementsContainer.innerHTML = achievements.map(ach => {
                const isUnlocked = userAchievements.includes(ach.id);
                return `
                    <div class="achievement-card ${isUnlocked ? 'unlocked' : 'locked'}">
                        <div class="achievement-icon">${ach.icon}</div>
                        <div class="achievement-name">${ach.name}</div>
                        <div class="achievement-desc">${ach.description}</div>
                        ${isUnlocked ? '<small>✅ Получено</small>' : '<small>🔒 Не разблокировано</small>'}
                    </div>
                `;
            }).join('');
            
            const history = getXPHistory(userId);
            const historyContainer = document.getElementById('xpHistoryList');
            if (history.length === 0) {
                historyContainer.innerHTML = '<div class="xp-history-item">Пока нет активных действий</div>';
            } else {
                historyContainer.innerHTML = history.map(item => `
                    <div class="xp-history-item">
                        <span>${item.action}</span>
                        <div>
                            <span class="xp-history-amount">+${item.amount} XP</span>
                            <span class="xp-history-date">${new Date(item.date).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
            }
        }
        
        setTimeout(() => {
            if (typeof getUserXP !== 'undefined') {
                displayGamification();
            }
        }, 500);
    </script>
</body>
</html>
