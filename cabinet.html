<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет | Bike Trails</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .cabinet-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }
        .cabinet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .info-card {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
        }
        .premium-active {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,149,0,0.1));
            border: 2px solid #ffd700;
            border-radius: 1rem;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        .premium-inactive {
            background: rgba(255,255,255,0.03);
            border-radius: 1rem;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1rem;
        }
        .favorites-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }
        .favorite-card {
            background: rgba(20,30,45,0.7);
            border-radius: 1rem;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .favorite-card:hover {
            transform: translateY(-3px);
        }
        .favorite-image {
            height: 150px;
            background-size: cover;
            background-position: center;
        }
        .favorite-info {
            padding: 1rem;
        }
        .btn-back, .btn-premium-action {
            background: rgba(74,144,226,0.2);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
        }
        .btn-premium-action {
            background: linear-gradient(135deg, #ffd700, #ff9500);
            color: #1a1a2e;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="cabinet-container">
        <div class="cabinet-header">
            <h1>👤 Личный кабинет</h1>
            <button class="btn-back" onclick="location.href='index.html'">← На главную</button>
        </div>
        
        <!-- Премиум статус -->
        <div id="premiumStatusBlock"></div>
        
        <div class="info-card">
            <p><strong>Имя пользователя:</strong> <span id="usernameDisplay"></span></p>
            <p><strong>Дата регистрации:</strong> <span id="regDateDisplay"></span></p>
        </div>
        
        <h2>⭐ Избранные маршруты</h2>
        <div id="favoritesContainer" class="favorites-grid">
            <div style="padding:2rem; text-align:center;">Загрузка...</div>
        </div>
    </div>
    
    <script src="theme.js"></script>
    <script>
        const CURRENT_USER_KEY = 'bike_trails_current_user';
        const USERS_KEY = 'bike_trails_users';
        
        function getCurrentUser() {
            const user = localStorage.getItem(CURRENT_USER_KEY);
            return user ? JSON.parse(user) : null;
        }
        
        function getUsers() {
            const users = localStorage.getItem(USERS_KEY);
            return users ? JSON.parse(users) : [];
        }
        
        function isPremium() {
            const user = getCurrentUser();
            if (!user) return false;
            if (user.isPremium) return true;
            
            const users = getUsers();
            const fullUser = users.find(u => u.id === user.id);
            if (fullUser && fullUser.premiumExpiry) {
                const expiryDate = new Date(fullUser.premiumExpiry);
                if (expiryDate > new Date()) return true;
            }
            return false;
        }
        
        function getPremiumDaysLeft() {
            const user = getCurrentUser();
            if (!user) return 0;
            const users = getUsers();
            const fullUser = users.find(u => u.id === user.id);
            if (fullUser && fullUser.premiumExpiry) {
                const diff = new Date(fullUser.premiumExpiry) - new Date();
                return Math.ceil(diff / (1000 * 60 * 60 * 24));
            }
            return 0;
        }
        
        function displayPremiumStatus() {
            const container = document.getElementById('premiumStatusBlock');
            if (!container) return;
            
            if (isPremium()) {
                const daysLeft = getPremiumDaysLeft();
                container.innerHTML = `
                    <div class="premium-active">
                        <div style="font-size:2rem;">💎</div>
                        <div><strong>Премиум-статус активен!</strong><br>Осталось дней: ${daysLeft}<br>Вам доступны эксклюзивные маршруты.</div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="premium-inactive">
                        💎 Нет активной премиум-подписки<br>
                        <button class="btn-premium-action" onclick="location.href='premium.html'" style="margin-top:0.5rem;">Оформить подписку</button>
                    </div>
                `;
            }
        }
        
        const user = getCurrentUser();
        if (!user) {
            location.href = 'index.html';
        } else {
            document.getElementById('usernameDisplay').innerText = user.username;
            const users = getUsers();
            const fullUser = users.find(u => u.id === user.id);
            if (fullUser && fullUser.createdAt) {
                document.getElementById('regDateDisplay').innerText = new Date(fullUser.createdAt).toLocaleDateString('ru-RU');
            } else {
                document.getElementById('regDateDisplay').innerText = 'Неизвестно';
            }
            
            displayPremiumStatus();
            
            const trails = [
                { id: 1, name: "Воробьёвы горы", image: "images/vorobyovy-gory-1.jpg" },
                { id: 2, name: "Куршская коса", image: "images/kurshskaya-kosa-1.jpg" },
                { id: 3, name: "Лаго-Наки", image: "" },
                { id: 4, name: "Алтайский Марс", image: "" },
                { id: 5, name: "Байкальская петля", image: "" },
                { id: 6, name: "Долина гейзеров", image: "" }
            ];
            
            const favorites = user.favorites || [];
            const container = document.getElementById('favoritesContainer');
            
            if (favorites.length === 0) {
                container.innerHTML = '<div style="padding:2rem; text-align:center; color:#8a9bb5;">⭐ У вас пока нет избранных маршрутов</div>';
            } else {
                const favoriteTrails = trails.filter(t => favorites.includes(t.id));
                container.innerHTML = favoriteTrails.map(trail => `
                    <div class="favorite-card" onclick="location.href='trail-${trail.id}.html'">
                        <div class="favorite-image" style="background: ${trail.image ? `url('${trail.image}')` : 'linear-gradient(135deg,#2b2d42,#353b48)'}; background-size:cover; background-position:center;"></div>
                        <div class="favorite-info"><h3>${trail.name}</h3></div>
                    </div>
                `).join('');
            }
        }
    </script>
</body>
</html>
